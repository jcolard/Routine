<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35" />
    </filter>

    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="8" />

  <!-- Calendar Base Card -->
  <rect x="96" y="106" width="320" height="310" rx="44" fill="#1e293b" stroke="#334155" stroke-width="6" />

  <!-- Calendar Top Header Bar -->
  <path d="M 96 150 C 96 125, 115 106, 140 106 L 372 106 C 397 106, 416 125, 416 150 L 416 174 L 96 174 Z" fill="url(#primaryGrad)" />

  <!-- Calendar Binder Rings -->
  <rect x="160" y="80" width="24" height="52" rx="12" fill="#f8fafc" />
  <rect x="328" y="80" width="24" height="52" rx="12" fill="#f8fafc" />

  <!-- 3 Routine Bars (representing Morning, Sport, Friday After) -->
  <!-- Routine 1: Morning (Cyan) -->
  <rect x="136" y="214" width="150" height="24" rx="12" fill="#38bdf8" opacity="0.9" />
  <!-- Routine 2: Sport (Emerald) -->
  <rect x="136" y="260" width="120" height="24" rx="12" fill="#10b981" opacity="0.9" />
  <!-- Routine 3: Evening/Special (Purple/Indigo) -->
  <rect x="136" y="306" width="90" height="24" rx="12" fill="#818cf8" opacity="0.9" />

  <!-- Large Glow Checkmark on the Right -->
  <g filter="url(#glow)">
    <circle cx="340" cy="290" r="64" fill="#0f172a" stroke="#22c55e" stroke-width="6" />
    <path d="M 314 290 L 334 310 L 370 268" fill="none" stroke="url(#checkGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
